<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <rect width="600" height="800" rx="12" fill="#0b0a0e"/>
  <!-- Sacred geometry mandala ornamental backpiece -->
  <g fill="none" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round">
    <circle cx="300" cy="380" r="180" stroke-opacity="0.4"/>
    <circle cx="300" cy="380" r="140" stroke-dasharray="3,6"/>
    <circle cx="300" cy="380" r="100"/>
    <circle cx="300" cy="380" r="60"/>
    <!-- Petals -->
    <path d="M 300,200 C 340,260 340,320 300,380 C 260,320 260,260 300,200 Z" fill="#14121c" fill-opacity="0.6"/>
    <path d="M 300,560 C 340,500 340,440 300,380 C 260,440 260,500 300,560 Z" fill="#14121c" fill-opacity="0.6"/>
    <path d="M 120,380 C 180,420 240,420 300,380 C 240,340 180,340 120,380 Z" fill="#14121c" fill-opacity="0.6"/>
    <path d="M 480,380 C 420,420 360,420 300,380 C 360,340 420,340 480,380 Z" fill="#14121c" fill-opacity="0.6"/>
    <!-- Unalome drop line -->
    <path d="M 300,560 L 300,680 M 290,670 Q 300,690 310,670 T 300,710 L 300,730" stroke="#f0e6d2" stroke-width="2"/>
  </g>
  <text x="300" y="760" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" fill="#f0e6d2" letter-spacing="3">ORNAMENTAL SACRED MANDALA</text>
</svg>
