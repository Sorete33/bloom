<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <rect width="600" height="800" rx="12" fill="#181720"/>
  <!-- Flash sheet frame -->
  <rect x="25" y="25" width="550" height="750" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.3"/>
  <g fill="none" stroke="#f4ebe1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Moon moth upper wings -->
    <path d="M 300,340 C 220,240 100,260 120,380 C 140,460 260,420 300,380 Z" fill="#12111a"/>
    <path d="M 300,340 C 380,240 500,260 480,380 C 460,460 340,420 300,380 Z" fill="#12111a"/>
    <!-- Moon moth tails -->
    <path d="M 230,410 C 210,480 180,560 210,600 C 220,610 230,580 250,500" stroke="#d4af37"/>
    <path d="M 370,410 C 390,480 420,560 390,600 C 380,610 370,580 350,500" stroke="#d4af37"/>
    <!-- Moth eyespots -->
    <circle cx="210" cy="340" r="22" stroke="#d4af37"/>
    <circle cx="210" cy="340" r="10" fill="#d4af37"/>
    <circle cx="390" cy="340" r="22" stroke="#d4af37"/>
    <circle cx="390" cy="340" r="10" fill="#d4af37"/>
    <!-- Moon phases top -->
    <path d="M 300,160 A 25 25 0 0 1 300,210 A 25 25 0 0 1 300,160" fill="#d4af37"/>
    <path d="M 240,170 A 20 20 0 0 1 240,200 A 14 14 0 0 0 240,170" fill="#f4ebe1"/>
    <path d="M 360,170 A 20 20 0 0 0 360,200 A 14 14 0 0 1 360,170" fill="#f4ebe1"/>
  </g>
  <text x="300" y="700" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" fill="#d4af37" letter-spacing="3">LUNAR MOTH FLASH #04</text>
  <text x="300" y="725" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#8c8599" letter-spacing="2">AVAILABLE FLASH DESIGN</text>
</svg>
