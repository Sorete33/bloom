backend:
  name: github
  repo: Sorete33/bloom
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  # Configuracion de la Pagina Principal
  - name: "homepage"
    label: "Página Principal"
    icon: "home"
    files:
      - file: "content/_index.md"
        label: "Página Inicio"
        name: "index"
        fields:
          - { label: "Título del Sitio", name: "title", widget: "string" }
          - label: "Banner Principal (Hero)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Nombre / Encabezado", name: "heading", widget: "string" }
              - { label: "Subtítulo / Eslógan", name: "tagline", widget: "string" }
              - { label: "Imagen de Fondo", name: "banner_image", widget: "image", hint: "Usá JPG o PNG (sin HEIC)" }
          - label: "Biografía del Artista"
            name: "bio"
            widget: "object"
            fields:
              - { label: "Fotografía de Perfil", name: "photo", widget: "image", hint: "Usá JPG o PNG (sin HEIC)" }
              - { label: "Especialidades", name: "specialties", widget: "list" }
              - { label: "Descripción / Historia", name: "description", widget: "text" }
          - label: "Datos de Reservas & Turnos"
            name: "booking"
            widget: "object"
            fields:
              - { label: "Ubicación del Estudio", name: "location", widget: "string" }
              - { label: "Estado de la Agenda", name: "status_notice", widget: "string" }
              - { label: "Enlace de Contacto (WhatsApp)", name: "contact_url", widget: "string" }
          - label: "Libro Interactivo (Portada)"
            name: "book"
            widget: "object"
            hint: "Título y foto de tapa del libro 3D de la sección Obras."
            fields:
              - { label: "Título en la Portada", name: "title", widget: "string", required: false, hint: "Ej: In Bloom — Libro de Obras 2026" }
              - { label: "Foto de Portada (opcional)", name: "cover", widget: "image", required: false, hint: "Dejalo vacío para usar la tapa de cuero clásica (JPG o PNG, sin HEIC)" }
          - label: "Redes Sociales"
            name: "social"
            widget: "object"
            fields:
              - { label: "Enlace de Instagram", name: "instagram", widget: "string" }
          - label: "Preguntas Frecuentes"
            name: "faq"
            widget: "list"
            fields:
              - { label: "Pregunta", name: "question", widget: "string" }
              - { label: "Respuesta", name: "answer", widget: "text" }

  # Libro de diseños (3D): cada entrada es una página y, si está disponible, un artículo en la Tienda.
  # Se filtran las entradas de la carpeta store con categoría "Diseños".
  - name: "libro"
    label: "Libro"
    icon: "menu_book"
    folder: "content/store"
    format: "yaml-frontmatter"
    extension: "md"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    filter:
      field: category
      value: "Diseños"
    reorder:
      key: weight
    fields:
      - { label: "Título del Diseño", name: "title", widget: "string", hint: "Se muestra debajo del libro y en la tarjeta de la tienda." }
      - { label: "Orden en el libro", name: "weight", widget: "number", required: false, hint: "Arrastrá las páginas en la lista para reordenarlas. Números bajos van primero." }
      - { label: "Tipo de Hoja", name: "page_type", widget: "hidden", default: "soft" }
      - { label: "Imagen", name: "image", widget: "image", hint: "Cada imagen agregada acá es una página del libro y, automáticamente, un artículo en la Tienda (Diseños). Usá JPG o PNG (sin HEIC)." }
      - { label: "Video (opcional)", name: "video", widget: "file", required: false, hint: "MP4 corto que se reproduce en la tienda. En el libro 3D se muestra la imagen." }
      - { label: "Categoría", name: "category", widget: "hidden", default: "Diseños" }
      - { label: "Disponible en Tienda", name: "for_sale", widget: "boolean", default: true, required: false, hint: "Activado por defecto: la página sale a la venta en la sección Diseños. Desactivá si no se vende." }
      - { label: "Precio", name: "price", widget: "number", value_type: "int", min: 0, required: false, hint: "Precio en pesos, solo números. Ej: 200000 se muestra como ARS$200.000" }
      - { label: "Enlace de Pago", name: "buy_url", widget: "string", required: false, hint: "URL de Mercado Pago u otro checkout" }
      - { label: "Vendido", name: "sold", widget: "boolean", default: false, required: false }
      - { label: "Descripción", name: "body", widget: "markdown", required: false }

  # Portafolio / Galería de obras (tatuajes, pinturas, dibujos). No incluye diseños (van al libro).
  - name: "portfolio"
    label: "Portafolio"
    icon: "palette"
    folder: "content/portfolio"
    format: "yaml-frontmatter"
    extension: "md"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    reorder:
      key: weight
    fields:
      - { label: "Título de la Obra", name: "title", widget: "string" }
      - { label: "Orden", name: "weight", widget: "number", required: false, hint: "Números bajos van primero." }
      - { label: "Imagen", name: "image", widget: "image", hint: "Usá JPG o PNG (sin HEIC)." }
      - label: "Categoría"
        name: "category"
        widget: "select"
        options: ["Tatuaje Curado", "Tatuaje Fresco", "Pinturas", "Dibujos"]
        hint: "Los diseños del libro se administran en la pestaña Libro."
      - { label: "Etiquetas", name: "tags", widget: "list", required: false, hint: "Ej: Línea fina, Floral, Negro y gris. Se muestran en la galería." }
      - { label: "Descripción o Notas", name: "body", widget: "markdown", required: false }

  # Tienda: todos los productos (diseños del libro + mercancía). Misma carpeta que el Libro.
  - name: "store"
    label: "Tienda"
    icon: "storefront"
    folder: "content/store"
    format: "yaml-frontmatter"
    extension: "md"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título del Producto", name: "title", widget: "string" }
      - { label: "Imagen", name: "image", widget: "image", hint: "Usá JPG o PNG (sin HEIC). Si agregás un video, esta imagen será el cartel (poster)." }
      - { label: "Video (opcional)", name: "video", widget: "file", required: false, hint: "MP4 corto para que se reproduzca solo en la tienda. Elegilo desde el media library." }
      - label: "Categoría"
        name: "category"
        widget: "select"
        default: "Calcomanías"
        options: ["Diseños", "Tatuaje Curado", "Tatuaje Fresco", "Pinturas", "Dibujos", "Calcomanías", "Remeras", "Prints"]
        hint: "Diseños = páginas del libro (se editan también en la pestaña Libro). Calcomanías, Remeras, Prints, etc. son productos sueltos."
      - { label: "Disponible en Tienda", name: "for_sale", widget: "boolean", default: true, required: false }
      - { label: "Precio", name: "price", widget: "number", value_type: "int", min: 0, required: false, hint: "Precio en pesos, solo números. Ej: 200000 se muestra como ARS$200.000" }
      - { label: "Enlace de Pago", name: "buy_url", widget: "string", required: false, hint: "URL de Mercado Pago u otro checkout" }
      - { label: "Vendido", name: "sold", widget: "boolean", default: false, required: false }
      - { label: "Descripción", name: "body", widget: "markdown", required: false }