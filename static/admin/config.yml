backend:
  name: github
  repo: Sorete33/bloom
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  # Configuracion de la Pagina Principal
  - name: "homepage"
    label: "Página Principal"
    files:
      - file: "content/_index.md"
        label: "Página Inicio"
        name: "index"
        fields:
          - { label: "Título del Sitio", name: "title", widget: "string" }
          - label: "Banner Principal (Hero)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Nombre / Encabezado", name: "heading", widget: "string" }
              - { label: "Subtítulo / Eslógan", name: "tagline", widget: "string" }
              - { label: "Imagen de Fondo", name: "banner_image", widget: "image", hint: "Usá JPG o PNG (sin HEIC)" }
          - label: "Biografía del Artista"
            name: "bio"
            widget: "object"
            fields:
              - { label: "Fotografía de Perfil", name: "photo", widget: "image", hint: "Usá JPG o PNG (sin HEIC)" }
              - { label: "Especialidades", name: "specialties", widget: "list" }
              - { label: "Descripción / Historia", name: "description", widget: "text" }
          - label: "Datos de Reservas & Turnos"
            name: "booking"
            widget: "object"
            fields:
              - { label: "Ubicación del Estudio", name: "location", widget: "string" }
              - { label: "Estado de la Agenda", name: "status_notice", widget: "string" }
              - { label: "Enlace de Contacto (WhatsApp)", name: "contact_url", widget: "string" }
          - label: "Redes Sociales"
            name: "social"
            widget: "object"
            fields:
              - { label: "Enlace de Instagram", name: "instagram", widget: "string" }
          - label: "Preguntas Frecuentes"
            name: "faq"
            widget: "list"
            fields:
              - { label: "Pregunta", name: "question", widget: "string" }
              - { label: "Respuesta", name: "answer", widget: "text" }

  # Editor de Portafolio
  - name: "portfolio"
    label: "Portafolio"
    folder: "content/portfolio"
    format: "yaml-frontmatter"
    extension: "md"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título de la Obra", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Imagen", name: "image", widget: "image", hint: "Usá JPG o PNG (sin HEIC)" }
      - label: "Categoría"
        name: "category"
        widget: "select"
        options: ["Tatu Curado", "Tatu Fresco", "Pinturas", "Dibujos", "Diseños Disponibles"]
      - { label: "Descripción o Notas", name: "body", widget: "markdown", required: false }
      - { label: "Etiquetas (categorías)", name: "tags", widget: "list", required: false, hint: "Ej: Remeras, Calcomanías, Pinturas, Diseños..." }
      - { label: "Disponible en Tienda", name: "for_sale", widget: "boolean", default: false, required: false }
      - { label: "Precio", name: "price", widget: "string", required: false, hint: "Ej: AR$ 45.000" }
      - { label: "Enlace de Pago", name: "buy_url", widget: "string", required: false, hint: "URL de Mercado Pago u otro checkout" }
      - { label: "Vendido", name: "sold", widget: "boolean", default: false, required: false }

  # Editor de la Tienda
  - name: "store"
    label: "Tienda"
    folder: "content/store"
    format: "yaml-frontmatter"
    extension: "md"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título del Producto", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Imagen", name: "image", widget: "image", hint: "Usá JPG o PNG (sin HEIC)" }
      - { label: "Etiquetas (categorías)", name: "tags", widget: "list", required: false, hint: "Ej: Remeras, Calcomanías, Pinturas, Diseños..." }
      - { label: "Precio", name: "price", widget: "string", required: false, hint: "Ej: AR$ 45.000" }
      - { label: "Enlace de Pago", name: "buy_url", widget: "string", required: false, hint: "URL de Mercado Pago u otro checkout" }
      - { label: "Vendido", name: "sold", widget: "boolean", default: false, required: false }
      - { label: "Descripción", name: "body", widget: "markdown", required: false }
