<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <rect width="600" height="800" rx="12" fill="#121118"/>
  <g fill="none" stroke="#e8dfd3" stroke-width="1.8" stroke-linecap="round">
    <!-- Chrysanthemum bloom center -->
    <circle cx="300" cy="380" r="16" fill="#d4af37" stroke="#d4af37"/>
    <!-- Layered chrysanthemum petals -->
    <path d="M 300,364 C 290,300 310,300 300,364 Z"/>
    <path d="M 300,396 C 290,460 310,460 300,396 Z"/>
    <path d="M 284,380 C 220,370 220,390 284,380 Z"/>
    <path d="M 316,380 C 380,370 380,390 316,380 Z"/>
    <!-- Diagonal petals -->
    <path d="M 288,368 C 240,310 260,290 288,368 Z"/>
    <path d="M 312,368 C 360,310 340,290 312,368 Z"/>
    <path d="M 288,392 C 240,450 260,470 288,392 Z"/>
    <path d="M 312,392 C 360,450 340,470 312,392 Z"/>
    <!-- Outer flowing ribbons & leaves -->
    <path d="M 300,460 Q 250,560 200,640" stroke="#d4af37" stroke-width="2"/>
    <path d="M 300,460 Q 350,560 400,640" stroke="#d4af37" stroke-width="2"/>
  </g>
  <text x="300" y="730" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" fill="#d4af37" letter-spacing="3">CHRYSANTHEMUM FLASH</text>
  <text x="300" y="755" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#8c8599" letter-spacing="2">NEO-TRADITIONAL BLACKWORK</text>
</svg>
